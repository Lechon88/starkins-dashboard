name: Build and publish Starkins Dashboard

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "updater.py"
      - "version.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.2.$env:GITHUB_RUN_NUMBER"
          Set-Content -Path version.py -Value "APP_VERSION = `"$version`"`nGITHUB_REPOSITORY = `"Lechon88/starkins-dashboard`"`nASSET_NAME = `"StarkinsDashboard.exe`"" -Encoding ascii
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name StarkinsDashboard --distpath dist --workpath build --specpath build main.py

      - name: Create release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $hash = (Get-FileHash dist\StarkinsDashboard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist\StarkinsDashboard.exe.sha256 -Value "$hash  StarkinsDashboard.exe" -NoNewline -Encoding ascii
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\StarkinsDashboard.exe dist\StarkinsDashboard.exe.sha256 --clobber
          } else {
            gh release create $tag dist\StarkinsDashboard.exe dist\StarkinsDashboard.exe.sha256 --title "Starkins Dashboard $tag" --notes "Automatisch aus dem main-Branch gebaut."
          }

